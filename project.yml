name: MusicDL
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
targets:
  MusicDL:
    type: application
    platform: iOS
    sources:
      - path: MusicDL
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MusicDL
        INFOPLIST_FILE: MusicDL/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
    dependencies:
      - sdk: WebKit.framework
      - sdk: AVFoundation.framework
