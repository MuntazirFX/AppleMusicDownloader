name: MusicDL
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
targets:
  MusicDL:
    type: application
    platform: iOS
    sources:
      - path: MusicDL
        excludes:
          - "Info.plist"
          - "Assets.xcassets"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MusicDL
        INFOPLIST_FILE: MusicDL/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: MusicDL/MusicDL.entitlements
        SWIFT_VERSION: "5.0"
