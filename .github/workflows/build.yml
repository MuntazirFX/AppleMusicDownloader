name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, iphoneos)
        run: |
          set -o pipefail
          xcodebuild -project MusicDL.xcodeproj \
            -scheme MusicDL \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MusicDL.app Payload/
          zip -qr MusicDL.ipa Payload
          ls -lh MusicDL.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicDL-ipa
          path: MusicDL.ipa
