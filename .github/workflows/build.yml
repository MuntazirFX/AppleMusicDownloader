name: Build Heavy Premium IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Inject Frameworks
        run: |
          # 1. Structure directory setup
          mkdir -p build/Payload/MusicDownloader.app/Frameworks
          
          # 2. Main app binary compiler execution
          xcrun -sdk iphoneos swiftc AppDelegate.swift ViewController.swift -o build/Payload/MusicDownloader.app/MusicDownloader -target arm64-apple-ios15.0
          
          # 3. Injecting plist data metadata
          cp Info.plist build/Payload/MusicDownloader.app/
          
          # 4. Moving dynamic libraries (.dylib/frameworks) into the bundle
          # Ensure you have uploaded your .dylib files inside a 'Frameworks' folder in your repository
          if [ -d "Frameworks" ]; then
            cp -R Frameworks/* build/Payload/MusicDownloader.app/Frameworks/
          fi
          
          # 5. Final bundling compression
          cd build
          zip -r MusicDownloader_Full.ipa Payload
          
      - name: Upload Complete IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-Full-IPA
          path: build/MusicDownloader_Full.ipa
